# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other:
#
---
include:
  # ---- Standalone: left half is central ----
  - board: nice_nano//zmk
    shield: sofle_left nice_oled
    snippet: studio-rpc-usb-uart
    artifact-name: standalone-sofle_left

  # ---- Dongle: dongle is central, left becomes a peripheral ----
  - board: nice_nano//zmk
    shield: sofle_dongle dongle_display
    snippet: studio-rpc-usb-uart
    artifact-name: dongle-sofle_dongle
  - board: nice_nano//zmk
    shield: sofle_left nice_oled
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n -DCONFIG_NICE_OLED_PERIPHERAL_CRYSTAL=y
    artifact-name: dongle-sofle_left

  # ---- Same firmware for both setups ----
  - board: nice_nano//zmk
    shield: sofle_right nice_oled
  - board: nice_nano//zmk
    shield: settings_reset
